# NMC inference Deployment for DWS Flex TPU nodes (2x2x1, tpu7x, TP=4).
# Uses emptyDir for weights (no PVC). Weight download (~3.5min) per pod start.
#
# DWS Flex: single-host-vllm pool uses Dynamic Workload Scheduler (Flex Start).
# GKE auto-taints Flex nodes with google.com/tpu + cloud.google.com/gke-queued.
# Pods MUST tolerate both taints or the autoscaler won't request capacity.
#
# Async scheduling: overlaps previous step's D2H transfer with next step's
# input prep + forward dispatch. Confirmed +8-29% throughput improvement at
# c4-c16 over Config B baseline. Uses explicit command/args array (NOT
# VLLM_ARGS env) to avoid shell word-splitting issues.
#
# Usage:
#   kubectl apply -f nmc-v7x-deployment.yaml
#   kubectl rollout status deployment/nmc-v7x-inference
#   # Once Running + Ready, test via kubectl exec:
#   kubectl exec deployment/nmc-v7x-inference -- python3 -c "
#   import urllib.request, json
#   req = urllib.request.Request('http://localhost:8000/v1/completions',
#       data=json.dumps({'model':'CohereLabs/North-Mini-Code-1.0','prompt':'def hello():','max_tokens':32,'temperature':0}).encode(),
#       headers={'Content-Type':'application/json'})
#   print(json.loads(urllib.request.urlopen(req).read())['choices'][0]['text'])
#   "

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nmc-v7x-inference
  labels:
    app: nmc-v7x-inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 1800  # 30min: allow weight download + compile
  selector:
    matchLabels:
      app: nmc-v7x-inference
  template:
    metadata:
      labels:
        app: nmc-v7x-inference
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
        cloud.google.com/gke-nodepool: single-host-vllm

      # DWS Flex tolerations (CRITICAL — without these, autoscaler won't
      # request capacity from Google).
      tolerations:
        - key: "google.com/tpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "cloud.google.com/gke-queued"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        # Tolerate disk-pressure taint (leftover emptyDir data from prior
        # weight downloads). Remove once node disk is cleaned.
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"

      terminationGracePeriodSeconds: 30  # fast cleanup on preemption

      containers:
        - name: nmc-server
          image: gcr.io/northam-ce-mlai-tpu/nmc-inference:latest
          imagePullPolicy: Always
          # Explicit command+args array (NOT VLLM_ARGS env) to avoid shell
          # word-splitting. Async scheduling confirmed working.
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model
            - CohereLabs/North-Mini-Code-1.0
            - --port
            - "8000"
            - --tensor-parallel-size
            - "4"
            - --dtype
            - bfloat16
            - --trust-remote-code
            - --max-model-len
            - "8192"
            - --max-num-seqs
            - "32"
            - --max-num-batched-tokens
            - "4096"
            - --no-enable-prefix-caching
            - --gpu-memory-utilization
            - "0.9"
            - --seed
            - "42"
            - --async-scheduling
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
            - name: SKIP_JAX_PRECOMPILE
              value: "1"
            - name: VLLM_XLA_CHECK_RECOMPILATION
              value: "0"
            - name: ATTN_BUCKETIZED_NUM_REQS
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            requests:
              google.com/tpu: 4
            limits:
              google.com/tpu: 4
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 80  # 60s + 80*15s = 20min for download + compile
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 6

      volumes:
        - name: hf-cache
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
